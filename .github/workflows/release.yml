name: CI/CD · Build → Test → Staging → Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build (ncc → dist/)
        run: npx ncc build src/index.js -o dist --license licenses.txt
      - name: Assemble the bundle
        run: |
          mkdir -p bundle
          cp -r dist action.yml package.json README.md LICENSE bundle/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/

  test-unit:
    name: Unit tests (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Unit tests
        run: npm run test:unit

  coverage:
    name: Coverage gate + JUnit report
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write              # to publish the test report as a check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Unit tests with coverage (lines ≥ 90 %, functions ≥ 90 %, branches ≥ 80 %)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          npm run test:coverage | tee reports/coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## 📊 Coverage report"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' reports/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish JUnit test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: Unit test report
          path: reports/unit-junit.xml
          reporter: java-junit
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            coverage/
          retention-days: 14

  test-integration-staging:
    name: Integration tests (TEST_ENV=staging)
    needs: [test-unit, coverage]
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle/
      - name: Integration tests on the built bundle
        run: npm run test:integration

  deploy-staging:
    name: Deploy to staging
    needs: test-integration-staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle/
      - name: Release staging build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          (cd bundle && zip -r ../build.zip .)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" build.zip --target "$GITHUB_SHA" --prerelease --title "$TAG" \
            --notes "$NOTE — unit (Node 20/22), coverage gate and staging integration tests passed (commit: $GITHUB_SHA)"
          echo "url=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_OUTPUT"
          echo "### 🧪 Staging release $TAG created" >> "$GITHUB_STEP_SUMMARY"

  test-integration-prod:
    name: Integration tests (TEST_ENV=prod)
    needs: deploy-staging
    runs-on: ubuntu-latest
    env:
      TEST_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle/
      - name: Stricter production checks on the same bundle
        run: npm run test:integration

  deploy-production:
    name: Deploy to production
    needs: test-integration-prod
    runs-on: ubuntu-latest
    environment:
      name: production           # required reviewer approves here
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle/
      - name: Release production build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Update BUILD_TAG in the production environment."
            exit 1
          fi
          (cd bundle && zip -r ../build.zip .)
          gh release create "$TAG" build.zip --target "$GITHUB_SHA" --latest --title "$TAG" \
            --notes "$NOTE — all test gates passed: unit (Node 20/22), coverage, integration staging + prod (commit: $GITHUB_SHA)"
          echo "url=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Production release $TAG published" >> "$GITHUB_STEP_SUMMARY"

  open-issue-on-failure:
    name: Open issue if a test gate fails
    needs: [build, test-unit, coverage, test-integration-staging, test-integration-prod]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update the ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: >-
            build=${{ needs.build.result }},
            unit=${{ needs.test-unit.result }},
            coverage=${{ needs.coverage.result }},
            integration-staging=${{ needs.test-integration-staging.result }},
            integration-prod=${{ needs.test-integration-prod.result }}
        run: |
          gh label create ci-failure --color B60205 --description "Automated: pipeline test failure" --force
          BODY="Workflow **$GITHUB_WORKFLOW** failed on commit $GITHUB_SHA. Job results: $RESULTS. Nothing was released. Run: $RUN_URL"
          ISSUE=$(gh issue list --label ci-failure --state open --json number -q '.[0].number')
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "❌ Test gate failed in the release pipeline" --label ci-failure --body "$BODY"
          fi

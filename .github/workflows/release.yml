name: CI/CD · Staging → Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (ncc → dist/)
        run: npx ncc build src/index.js -o dist --license licenses.txt

      - name: Smoke test (the action entry point exists)
        run: test -s dist/index.js && echo "dist/index.js OK"

      - name: Package build.zip
        run: zip -r build.zip dist action.yml package.json README.md LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release staging build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          # Staging can be redeployed: replace an older pre-release with the same tag.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Replacing existing staging release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" build.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TAG" \
            --notes "$NOTE (commit: $GITHUB_SHA)"
          echo "url=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_OUTPUT"
          echo "### 🧪 Staging release $TAG created" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production         # required reviewers must approve before this job starts
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release production build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          # Production is immutable: never overwrite an existing release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Update BUILD_TAG in the production environment (e.g. prod-v1.1)."
            exit 1
          fi
          gh release create "$TAG" build.zip \
            --target "$GITHUB_SHA" \
            --latest \
            --title "$TAG" \
            --notes "$NOTE (commit: $GITHUB_SHA)"
          echo "url=$(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Production release $TAG published" >> "$GITHUB_STEP_SUMMARY"
